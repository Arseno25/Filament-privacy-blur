name: "Run Tests"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # PHP 8.2 - Filament 4.x only (v5 requires PHP 8.3+)
          - os: ubuntu-latest
            php: '8.2'
            laravel: 11.*
            testbench: 9.*
            filament: 4.*
          - os: ubuntu-latest
            php: '8.2'
            laravel: 12.*
            testbench: 10.*
            filament: 4.*

          # PHP 8.3+ - Both Filament 4.x and 5.x
          - os: ubuntu-latest
            php: '8.4'
            laravel: 11.*
            testbench: 9.*
            filament: 4.*
          - os: ubuntu-latest
            php: '8.4'
            laravel: 11.*
            testbench: 9.*
            filament: 5.*
          - os: ubuntu-latest
            php: '8.4'
            laravel: 12.*
            testbench: 10.*
            filament: 4.*
          - os: ubuntu-latest
            php: '8.4'
            laravel: 12.*
            testbench: 10.*
            filament: 5.*

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - F${{ matrix.filament }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" "filament/filament:${{ matrix.filament }}" --no-interaction --no-update
          if [[ "${{ matrix.laravel }}" == "11.*" ]]; then
            # No unflagged Laravel 11 releases are currently installable with
            # Composer's advisory blocking. Override ONLY for this isolated
            # compatibility test install, never in the package or production.
            echo "::warning::Laravel 11 currently has known security advisories. This CI-only compatibility job installs affected dependencies; do not use this override in production."
            COMPOSER_POLICY_ADVISORIES_BLOCK=0 composer update --prefer-dist --no-interaction --no-scripts --no-audit
          else
            composer update --prefer-dist --no-interaction --no-scripts --no-audit
          fi

      - name: Report Laravel 11 security advisories (non-blocking)
        if: matrix.laravel == '11.*'
        run: |
          # This compatibility check must not conceal unresolved advisories.
          if ! composer audit --no-dev --format=summary; then
            echo "::warning::Known vulnerabilities remain in the Laravel 11 compatibility test dependencies. Review the Composer audit output; do not deploy these versions without remediation."
          fi

      - name: List Installed Dependencies
        run: composer show -D

      - name: Execute tests
        run: vendor/bin/pest --ci

      - name: Laravel Pint style validation
        if: matrix.php == '8.4' && matrix.laravel == '12.*' && matrix.filament == '5.*'
        run: vendor/bin/pint --test

      - name: PHPStan static analysis
        if: matrix.php == '8.4' && matrix.laravel == '12.*' && matrix.filament == '5.*'
        run: vendor/bin/phpstan analyse --no-progress
